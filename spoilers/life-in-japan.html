<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Life in Japan | Le Ha Phuong</title>
  <meta name="description" content="Phuong in Japan">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script>
    try {
      const savedTheme = localStorage.getItem("theme") || "dark";
      document.documentElement.dataset.theme = savedTheme;
    } catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <style>
    :root {
      --background: #000000;
      --surface: #0c0c0c;
      --text: #ffffff;
      --muted: #bdbdbd;
      --border: #333333;
    }

    html[data-theme="light"] {
      --background: #ffffff;
      --surface: #f5f5f5;
      --text: #111111;
      --muted: #555555;
      --border: #dddddd;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Crimson Pro", Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.75;
      transition:
        background-color 0.25s,
        color 0.25s;
    }

    a {
      color: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--background);
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1400px;
      min-height: 76px;
      margin: auto;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .site-name {
      font-family: "Inter", Arial, sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      font-family: "Inter", Arial, sans-serif;
    }

    .nav-links > a,
    summary {
      padding: 8px 0;
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-links > a:hover,
    .nav-links > a.active,
    summary:hover,
    summary.active {
    border-bottom: 1px solid var(--text);
    }

    details {
      position: relative;
    }

    summary {
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      margin-left: 7px;
      content: "⌄";
    }

    .dropdown {
      position: absolute;
      top: 42px;
      left: 0;
      min-width: 190px;
      padding: 9px;
      background: var(--background);
      border: 1px solid var(--border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .dropdown a {
      display: block;
      padding: 10px 12px;
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      white-space: nowrap;
    }

    .dropdown a:hover {
      background: var(--surface);
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .theme-toggle:hover {
      border-color: var(--text);
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 70px 30px 100px;
    }

    .page-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: "Inter", Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 54px;
      font-family: "Crimson Pro", Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 7vw, 4.5rem);
      font-weight: 400;
      line-height: 1;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .gallery-card {
      width: 100%;
      padding: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font: inherit;
      transition:
        transform 0.2s,
        border-color 0.2s;
    }

    .gallery-card:hover {
      transform: translateY(-2px);
      border-color: var(--text);
    }

    .gallery-thumbnail {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--surface);
    }

    .gallery-thumbnail img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .gallery-card:hover .gallery-thumbnail img {
      transform: scale(1.02);
    }

    .gallery-caption {
      display: block;
      padding: 18px 20px;
      font-family: "Crimson Pro", Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1.75;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px 90px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-content {
      max-width: min(1000px, 82vw);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-content img {
      display: block;
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
    }

    .lightbox-caption {
      width: 100%;
      margin-top: 12px;
      color: #cccccc;
      font-family: "Crimson Pro", Georgia, "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 30px;
      border: 0;
      background: transparent;
      color: #ffffff;
      font-size: 2rem;
      cursor: pointer;
    }

    footer {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 850px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .nav-links {
        width: 100%;
        flex-wrap: wrap;
        gap: 10px 22px;
      }

      .dropdown {
        position: static;
        margin-top: 5px;
      }

      main {
        padding-top: 50px;
      }
    }

    @media (max-width: 700px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .lightbox {
        padding: 60px 15px;
      }

      .lightbox-content {
        max-width: 90vw;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a class="site-name" href="../index.html">Le Ha Phuong</a>

      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../research.html">Research</a>
        <a href="../cv.html">CV</a>

        <details>
          <summary>Economics</summary>
          <div class="dropdown">
            <a href="../economics/empirical-studies.html">Empirical studies</a>
            <a href="../economics/notes.html">Notes</a>
            <a href="../economics/useful-sources.html">Useful sources</a>
          </div>
        </details>

        <details>
          <summary class="active">Spoilers</summary>
          <div class="dropdown">
            <a href="bookshelf.html">Bookshelf</a>
            <a href="theater.html">Theater</a>
            <a href="life-in-japan.html">Life in Japan</a>
          </div>
        </details>

        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Switch colour theme"
          title="Switch colour theme"
        >☀</button>
      </div>
    </nav>
  </header>

  <main>
    <p class="page-label">Spoilers</p>
    <h1>Life in Japan</h1>

    <div class="gallery-grid" id="gallery-grid"></div>
  </main>

  <footer>
    © <span id="year"></span> Le Ha Phuong
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button
      class="lightbox-close"
      id="lightbox-close"
      aria-label="Close"
      type="button"
    >×</button>

    <div class="lightbox-content">
      <img id="lightbox-image" src="" alt="">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script>
    const page = document.documentElement;
    const toggle = document.getElementById("theme-toggle");

    function updateThemeIcon() {
      toggle.textContent = page.dataset.theme === "dark" ? "☀" : "☾";
    }

    updateThemeIcon();

    toggle.addEventListener("click", function () {
      const newTheme =
        page.dataset.theme === "dark" ? "light" : "dark";

      page.dataset.theme = newTheme;
      localStorage.setItem("theme", newTheme);
      updateThemeIcon();
    });

    document.getElementById("year").textContent =
      new Date().getFullYear();

    /*
      ADD NEW PHOTOS HERE ONLY.
      Upload the image to assets/spoilers/life-in-japan/, then add one line below.
    */
    const galleryItems = [
      { image: "../assets/spoilers/life-in-japan/Iiyama_line.jpg", caption: "Iiyama line, 03/2025" },
      { image: "../assets/spoilers/life-in-japan/Shirakawago_2612.jpg", caption: "Shirakawa-go, 12/2025" },
      { image: "../assets/spoilers/life-in-japan/Togakushi_Jinja_2612.jpg", caption: "Togakushi Jinja, 12/2025" },
      { image: "../assets/spoilers/life-in-japan/yokohama_2602.jpg", caption: "Unusual day, YNU, 02/2026" },
      { image: "../assets/spoilers/life-in-japan/Yokohama_night.jpg", caption: "Summer night, Yokohama, 09/2026" },
    ];

    const galleryGrid = document.getElementById("gallery-grid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const closeButton = document.getElementById("lightbox-close");

    function openLightbox(image, caption) {
      lightboxImage.src = image;
      lightboxImage.alt = caption;
      lightboxCaption.textContent = caption;
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function makeGalleryCard(item) {
      const card = document.createElement("button");
      card.className = "gallery-card";
      card.type = "button";

      const thumbnail = document.createElement("div");
      thumbnail.className = "gallery-thumbnail";

      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.caption;
      img.loading = "lazy";

      const caption = document.createElement("span");
      caption.className = "gallery-caption";
      caption.textContent = item.caption;

      thumbnail.appendChild(img);
      card.appendChild(thumbnail);
      card.appendChild(caption);

      card.addEventListener("click", () => {
        openLightbox(item.image, item.caption);
      });

      return card;
    }

    galleryItems.forEach(item => {
      galleryGrid.appendChild(makeGalleryCard(item));
    });

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImage.src = "";
      document.body.style.overflow = "";
    }

    closeButton.addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
